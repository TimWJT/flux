name: release

# Tag a commit to cut a release:
#   git tag v1.2.1 && git push origin v1.2.1
# The Windows installers are built and attached to a DRAFT release,
# which you review and publish by hand from the Releases page.
#
# Windows only: the gamma backend is Win32 SetDeviceGammaRamp. On macOS and
# Linux the native side is a no-op, so installers there would do nothing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  installers:
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      # Job-level so the step `if:` below can read it (secrets can't be used in `if:` directly).
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Test
        run: npm test
        timeout-minutes: 2

      - name: Rust tests
        run: npm run build && cargo test --manifest-path src-tauri/Cargo.toml
        timeout-minutes: 20

      # tauri.conf.json has an updater pubkey and createUpdaterArtifacts: true.
      # `tauri build` fails outright when that is set and no private key is in the
      # environment. Without the secret, build plain installers (no .sig, no
      # latest.json); in-app updates then report "no update" until the secret
      # TAURI_SIGNING_PRIVATE_KEY (matching that pubkey) is added to the repo.
      - name: Skip updater artifacts when no signing key is configured
        if: env.HAS_SIGNING_KEY != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          "
          echo '::warning::TAURI_SIGNING_PRIVATE_KEY is not set: building without updater artifacts.'

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and writes latest.json onto the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Night Light ${{ github.ref_name }}'
          releaseBody: |
            ## Which file do I download?

            Pick **one** file from **Assets** below. You can ignore everything else.

            | What you want | Download the file ending in |
            |---|---|
            | **Windows app** (warms your screen) | **`_x64-setup.exe`** |
            | **Try it in a browser** (window preview only, does not change the display) | **`Night.Light.html`** |

            ### First launch warning

            The app is free and not code-signed, so Windows will warn once:
            "Windows protected your PC": click **More info**, then **Run anyway**.

            ### The other files

            `.msi` is an alternative Windows installer for people who specifically need it.
            `.sig` files and `latest.json` (when present) are used by the app's built-in
            updater; you never need to download them.
          releaseDraft: true
          prerelease: false

  standalone-html:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: installers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
        timeout-minutes: 2
      - run: npm run build
      - name: Attach the single-file build to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: 'dist-standalone/Night Light.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
